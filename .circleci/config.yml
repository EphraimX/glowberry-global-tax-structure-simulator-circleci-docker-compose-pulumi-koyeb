version: 2.1
orbs:
  pulumi: pulumi/pulumi@2.1.0
jobs:
  pulumi-deploy:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Debug file structure
          command: |
            pwd
            ls -al
            ls -al pulumi-koyeb
      - pulumi/login
      - run:
          name: Select or initialize Pulumi stack
          working_directory: ~/project/pulumi-koyeb
          command: |
            if ! pulumi stack select glowberry-dev-gha-stack 2>/dev/null; then
              pulumi stack init glowberry-dev-gha-stack
            fi
      - run:
          name: Installing Koyeb Pulimi Resource & Pulumi Preview
          working_directory: ~/project/pulumi-koyeb
          command: |
            mkdir -p ~/.pulumi/plugins/resource-koyeb-v0.1.11
            curl -L https://github.com/koyeb/pulumi-koyeb/releases/download/v0.1.11/pulumi-resource-koyeb-v0.1.11-linux-amd64.tar.gz | tar -xz -C ~/.pulumi/plugins/resource-koyeb-v0.1.11
            pulumi preview
      - run:
          name: Pulumi Up
          working_directory: ~/project/pulumi-koyeb
          command: pulumi up -y

workflows:
  build-and-deploy-to-koyeb:
    jobs:
      - pulumi-deploy:
          context: PROJECTS
