version: 2.1
orbs:
  pulumi: pulumi/pulumi@2.1.0
jobs:
  pulumi-deploy:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project/pulumi-koyeb/
    steps:
      - checkout
      - pulumi/login
      - run:
          name: Select or initialize Pulumi stack
          working_directory: ~/project/pulumi-koyeb/
          command: pulumi stack select EphraimX/pulumi-koyeb/glowberry-dev-gha-stack #|| pulumi stack init EphraimX/pulumi-koyeb/glowberry-dev-gha-stack
      - run:
          name: Pulumi Preview
          working_directory: ~/project/pulumi-koyeb/
          command: pulumi preview
      - run:
          name: Pulumi Up
          working_directory: ~/project/pulumi-koyeb/
          command: pulumi up -y
workflows:
  build-and-deploy-to-koyeb:
    jobs:
      - pulumi-deploy:
          context: PROJECTS